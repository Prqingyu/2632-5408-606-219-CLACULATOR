<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2632？ · 任意数构造器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-aurora"></div>
<div class="bg-grid"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">2632<span class="q">？</span></div>
    <h1>任意数构造器</h1>
  </div>
  <div class="sources-line" id="sourcesLine"></div>
</header>

<main class="layout">
  <section class="panel input-panel">
    <div class="panel-title"><span>目标数字</span></div>

    <div class="display" id="display">
      <input id="targetInput" inputmode="decimal" autocomplete="off" spellcheck="false"
             placeholder="输入数字" value="2026" maxlength="40">
      <div class="display-actions">
        <button class="ghost" id="backspaceBtn" title="退格">⌫</button>
        <button class="ghost" id="clearBtn" title="清空">C</button>
      </div>
    </div>

    <div class="keypad" id="keypad"></div>
    <div class="quick-row">
      <button id="randomBtn" class="random-btn" type="button">🎲 随机数字</button>
    </div>

    <div class="panel-title small"><span>规则</span></div>
    <div class="rules">
      <label class="switch"><input type="checkbox" id="optSplit" checked><span>拆数字</span></label>
      <label class="switch"><input type="checkbox" id="optPoint" checked><span>小数点</span></label>
      <label class="switch"><input type="checkbox" id="optPower" checked><span>幂</span></label>
      <label class="switch"><input type="checkbox" id="optFact"><span>阶乘</span></label>
      <label class="switch"><input type="checkbox" id="optSqrt"><span>根号</span></label>
      <label class="switch"><input type="checkbox" id="optFallback" checked><span>对数兜底</span></label>
    </div>

    <button class="generate" id="generateBtn"><span class="gen-icon">∑</span>开始构造</button>
    <div class="busy" id="busy" hidden><span class="spinner"></span><span id="busyText">搜索中…</span></div>
  </section>

  <section class="panel result-panel">
    <div class="result-head">
      <span class="mode-badge idle" id="modeBadge">等待输入</span>
      <span class="meta" id="resultMeta"></span>
    </div>

    <div class="expression-wrap">
      <div class="expression-label" id="exprLabel"></div>
      <div class="expression" id="expression"><span class="empty-tip">输入目标数字</span></div>
    </div>

    <div class="used" id="used"></div>
    <div class="note" id="note" hidden></div>

    <div class="actions">
      <button id="nextBtn" class="action primary-ghost">换一个 <span class="kbd">Tab</span></button>
      <button id="copyBtn" class="action">复制式子</button>
      <button id="deepBtn" class="action">加强搜索</button>
    </div>

    <div class="history-wrap">
      <div class="panel-title small">
        <span>历史记录</span>
        <button class="link" id="clearHistory">清空</button>
      </div>
      <ul class="history" id="history"><li class="empty">还没有记录</li></ul>
    </div>
  </section>
</main>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
